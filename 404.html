<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | wrk.money</title>
    <meta property="og:title" content="wrk.money">
    <meta property="og:description" content="">
    <meta property="og:image" content="">
    <meta property="og:url" content="">
    <meta property="og:type" content="profile">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="">
    <meta name="twitter:description" content="">
    <meta name="twitter:image" content="">
    <link rel="icon" type="image/png" href="/wrk_files/999circle.png">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(255,255,255,0.03); --border: rgba(255,255,255,0.1); --text: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }

        body { background: #000; min-height: 100vh; color: #fff; overflow-x: hidden; }

        #tsparticles { position: fixed; inset: 0; z-index: 0; }

        /* ── 404 layout: the main site with the power cut ── */
        body.is-dead { background: #050506; }
        body.is-dead .mini-nav { display: none !important; }
        #not-found {
            display: none; position: relative; z-index: 2;
            min-height: 100vh; flex-direction: column; color: #9aa0aa;
        }
        #not-found.visible { display: flex; }
        #not-found::after {
            content: ''; position: fixed; inset: 0; z-index: 3; pointer-events: none;
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px),
                radial-gradient(circle at 50% 45%, transparent 35%, rgba(0,0,0,0.75) 100%);
        }
        .dead-nav {
            display: flex; align-items: center; justify-content: space-between;
            height: 58px; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .dead-logo { display: flex; align-items: center; gap: 9px; color: #6f7580; font-size: 0.95rem; font-weight: 800; text-decoration: none; }
        .dead-logo img { width: 28px; height: 28px; filter: invert(1) brightness(0.45); }
        .dead-status { display: flex; align-items: center; gap: 8px; color: #6f7580; font-size: 0.75rem; font-weight: 700; }
        .dead-status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #8a2f2f; animation: ember 3.2s ease-in-out infinite; }
        .dead-hero { position: relative; z-index: 4; flex: 1; width: 100%; max-width: 860px; margin: 0 auto; padding: clamp(28px, 9vh, 90px) 20px 40px; }
        .dead-eyebrow { color: #7d8390; font-size: 0.78rem; font-weight: 700; margin-bottom: 10px; }
        #nf-num {
            font-size: clamp(6.5rem, 30vw, 13rem); font-weight: 800; letter-spacing: -6px; line-height: 0.95;
            color: #262a31; opacity: 1; animation: dying 7s linear infinite;
        }
        .dead-log { margin: 22px 0 28px; color: #8b919c; font-size: 0.86rem; line-height: 1.8; overflow-wrap: anywhere; }
        .dead-log .fail { color: #a05252; }
        #nf-cursor { display: inline-block; width: 8px; height: 1em; margin-left: 4px; vertical-align: -2px; background: #4d525b; }
        .back-home {
            display: inline-block; padding: 13px 22px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
            color: #c4c9d2; font-size: 0.88rem; font-weight: 700; text-decoration: none;
            transition: color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .back-home:hover, .back-home:focus-visible { color: #00ff88; border-color: #00ff88; outline: none; box-shadow: 0 8px 26px -8px rgba(0,255,136,0.7); }
        .dead-footer { padding: 0 20px 28px; color: #6f7580; font-size: 0.68rem; letter-spacing: 3px; text-align: center; }
        @keyframes dying {
            0%, 91%, 100% { opacity: 1; transform: none; }
            92% { opacity: 0.35; }
            93% { opacity: 1; }
            94% { opacity: 0.15; transform: translateX(3px); }
            95% { opacity: 0.8; transform: translateX(-2px); }
            96% { opacity: 0.25; transform: none; }
            97% { opacity: 1; }
        }
        @keyframes ember { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
        @media (prefers-reduced-motion: reduce) { #nf-num, .dead-status::before { animation: none; } }

        /* ── Profile layout (matches /$) ── */
        #enter-overlay {
            position: fixed; inset: 0; background: #000;
            display: flex; justify-content: center; align-items: center;
            z-index: 999; cursor: pointer; transition: opacity 1s ease, visibility 1s;
        }
        #enter-overlay.hidden { opacity: 0; visibility: hidden; }
        .enter-text {
            font-size: 0.7rem; letter-spacing: 5px; color: rgba(255,255,255,0.4);
            text-transform: uppercase; animation: pulse-text 2s infinite;
        }
        @keyframes pulse-text { 0%,100%{opacity:0.3} 50%{opacity:1} }

        #profile-wrap {
            display: none; position: relative; z-index: 1;
            min-height: 100vh; justify-content: center; align-items: center;
            padding: 40px 0; overflow-y: auto;
        }
        #profile-wrap.visible { display: flex; }

        .container {
            text-align: center; width: 100%; max-width: 400px;
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            opacity: 0; transform: translateY(10px); transition: all 1.5s ease;
        }
        .container.visible { opacity: 1; transform: translateY(0); }

        #matrix-bg { display: none; position: fixed; inset: 0; z-index: 0; }
        #bg-media { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
        header {
            position: relative;
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 4px; padding: 25px 20px; backdrop-filter: blur(8px);
        }
        .visit-count { font-size: 0.5rem; opacity: 0.15; letter-spacing: 2px; text-align: right; margin-top: 10px; }
        .uid-label { font-size: 0.5rem; opacity: 0.2; letter-spacing: 3px; margin-top: 4px; }
        .pfp { width: 80px; height: 80px; border-radius: 4px; border: 1px solid var(--border); margin-bottom: 1rem; object-fit: cover; }
        .name-row { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
        h1 { font-size: clamp(1.4rem, 8vw, 2.2rem); font-weight: 700; letter-spacing: clamp(1px, 1vw, 4px); text-transform: lowercase; opacity: 0.9; word-break: break-word; overflow-wrap: break-word; }
        .badge-container { position: relative; display: inline-block; }
        .badge-img { width: 24px; height: 24px; cursor: default; transition: transform 0.3s ease; vertical-align: middle; }
        .badge-img:hover { transform: scale(1.2); }
        .tooltip { visibility: hidden; position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #fff; padding: 5px 10px; border: 1px solid var(--border); border-radius: 2px; font-size: 0.6rem; white-space: nowrap; z-index: 10; text-transform: lowercase; }
        .badge-container:hover .tooltip { visibility: visible; }
        .typewriter-container { font-size: 0.8rem; color: rgba(255,255,255,0.5); min-height: 1.5em; text-transform: lowercase; margin-top: 10px; }
        #cursor { display: inline-block; width: 8px; height: 1rem; background: #fff; margin-left: 4px; vertical-align: middle; animation: blink 1s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

        .section-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 3px; color: rgba(255,255,255,0.2); margin: 5px 0 10px 5px; text-align: left; }
        .nav-group { display: flex; flex-direction: column; gap: 10px; }
        .hub-btn {
            display: flex; align-items: center; justify-content: center;
            padding: 20px; background: var(--glass); border: 1px solid var(--border);
            border-radius: 4px; text-decoration: none; color: var(--text);
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1); backdrop-filter: blur(8px);
            text-transform: lowercase; font-size: 0.85rem; letter-spacing: 1px;
            cursor: pointer; width: 100%; outline: none;
        }
        .hub-btn:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.5); transform: translateY(-2px); }
        .console-footer { margin-top: 20px; font-size: 0.65rem; opacity: 0.25; letter-spacing: 4px; width: 100%; text-align: center; }

        /* Audio player */
        .audio-box { background: var(--glass); border: 1px solid var(--border); border-radius: 4px; padding: 15px 20px; backdrop-filter: blur(8px); text-align: left; }
        .audio-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .track-name { font-size: 0.65rem; text-transform: lowercase; letter-spacing: 1px; color: rgba(255,255,255,0.6); }
        .audio-controls { display: flex; align-items: center; gap: 15px; }
        .play-btn { background: none; border: none; color: #fff; cursor: pointer; font-size: 0.8rem; opacity: 0.5; transition: opacity 0.3s; font-weight: bold; }
        .play-btn:hover { opacity: 1; }
        .volume-slider { -webkit-appearance: none; width: 50px; height: 1px; background: rgba(255,255,255,0.1); outline: none; cursor: pointer; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 6px; height: 6px; background: #fff; border-radius: 50%; }
        .progress-container { width: 100%; height: 2px; background: rgba(255,255,255,0.05); cursor: pointer; }
        .progress-bar { height: 100%; background: #fff; width: 0%; }

        #copy-toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255,255,255,0.1); backdrop-filter: blur(15px);
            border: 1px solid var(--border); color: #fff;
            padding: 12px 24px; border-radius: 4px; font-size: 0.75rem;
            z-index: 9999; transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            pointer-events: none; letter-spacing: 2px; text-transform: lowercase;
        }
        #copy-toast.show { transform: translateX(-50%) translateY(0); }
    </style>
    <link rel="stylesheet" href="/wrk_files/profile.css?v=4">
</head>
<body>

<canvas id="matrix-bg"></canvas>
<div id="tsparticles"></div>

<!-- Enter overlay (profile only) -->
<div id="enter-overlay" style="display:none">
    <div class="enter-text">[ click to enter ]</div>
</div>

<!-- 404 content -->
<div id="not-found">
    <div class="dead-nav">
        <a href="/" class="dead-logo"><img src="/wrk_files/999circle.png" alt="">wrk.money</a>
        <span class="dead-status">offline</span>
    </div>
    <main class="dead-hero">
        <p class="dead-eyebrow">connection lost</p>
        <h1 id="nf-num">404</h1>
        <div class="dead-log">
            <div>&gt; ping <span id="nf-path"></span></div>
            <div class="fail">&gt; request timed out</div>
            <div id="nf-msg">&gt; route not found. returning to safety is advised.<span id="nf-cursor"></span></div>
        </div>
        <a href="/" class="back-home">reconnect</a>
    </main>
    <div class="dead-footer">NETWORK.LOST // HUB_404</div>
</div>

<!-- Profile content -->
<div id="profile-wrap">
    <div class="container" id="main-content">
        <header>
            <img id="p-pfp" src="" alt="" class="pfp">
            <div class="name-row">
                <h1 id="p-name"></h1>
                <div id="p-badges"></div>
            </div>
            <div id="p-uid" class="uid-label"></div>
            <div class="typewriter-container">
                <span id="typewriter"></span><span id="cursor"></span>
            </div>
            <div id="p-visits" class="visit-count"></div>
        </header>
        <div id="p-tabs"></div>
        <div class="console-footer" id="p-footer"></div>
    </div>
</div>

<div id="copy-toast">copied</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tsparticles/2.12.0/tsparticles.bundle.min.js" integrity="sha384-gZSNMuUgSbqcltOBBRNXCH+szg+2C69ISFyCk2w+xsZc0iFU+bIVPfYPmLwLtNzz" crossorigin="anonymous"></script>
<script src="/wrk_files/gift.js?v=6"></script>
<script src="/wrk_files/code-rain.js?v=3"></script>
<script src="/wrk_files/profile.js?v=7"></script>
<script>
    const RESERVED = new Set([
        '$','$$','$$$','insanity','startpage','tools','404',
        'p','d','s','login','admin','settings','profile',
        'wrk_files','api','index','favicon','cname','readme',
        'auth','usage','assets','site-settings',
    ]);

    const pathParts = window.location.pathname.replace(/^\//, '').replace(/\/$/, '').split('/');
    const slug = pathParts[0];
    const isProfileCandidate = slug && slug.length >= 3 && !RESERVED.has(slug) && /^[a-z0-9-]+$/.test(slug);

    // A 404 is the site powered down: the live network, frozen and grey, with its links broken up.
    function showNotFound() {
        document.body.classList.add('is-dead');
        document.getElementById('not-found').classList.add('visible');
        document.getElementById('nf-path').textContent = `wrk.money${window.location.pathname}`;
        tsParticles.load("tsparticles", {
            particles: {
                number: { value: 45, density: { enable: true, area: 900 } },
                color: { value: "#5b606a" }, shape: { type: "circle" },
                opacity: { value: 0.45 }, size: { value: { min: 1, max: 2 } },
                links: { enable: true, distance: 95, color: "#5b606a", opacity: 0.22, width: 1 },
                move: { enable: false }
            }
        }).then(container => setTimeout(() => container.pause(), 400));
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            const toast = document.getElementById('copy-toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        });
    }

    function renderProfile(profile) {
        document.title = `${profile.displayName} | wrk.money`;

        document.getElementById('p-pfp').src = profile.avatar;
        document.getElementById('p-pfp').alt = profile.displayName;
        document.getElementById('p-name').textContent = profile.displayName;
        if (profile.uid !== undefined && profile.uid !== null)
            document.getElementById('p-uid').textContent = 'UID #' + profile.uid;

        const BADGE_DEFS = {
            admin:     { src: '/wrk_files/badge-admin.svg',     label: 'administrator' },
            early:     { src: '/wrk_files/badge-early.svg',     label: 'early starter' },
            tester:    { src: '/wrk_files/badge-tester.svg',    label: 'tester' },
            developer: { src: '/wrk_files/badge-developer.svg', label: 'developer' },
        };
        const badgesEl = document.getElementById('p-badges');
        (profile.badges || []).forEach(id => {
            const b = BADGE_DEFS[id];
            if (!b) return;
            const div = document.createElement('div');
            div.className = 'badge-container';
            div.innerHTML = `<img src="${escHtml(b.src)}" alt="${escHtml(b.label)}" class="badge-img"><span class="tooltip">${escHtml(b.label)}</span>`;
            badgesEl.appendChild(div);
        });

        addGiftBadge(profile.tgGiftUrl, el => badgesEl.prepend(el));
        document.getElementById('p-footer').textContent = profile.footer || '';

        // Music player
        if (profile.musicEnabled && profile.musicUrl) {
            const audioBox = document.createElement('div');
            audioBox.className = 'audio-box';
            audioBox.id = 'p-audio-box';
            audioBox.innerHTML = `
                <div class="audio-info">
                    <span class="track-name">${escHtml(profile.musicTitle || 'untitled')}</span>
                    <div class="audio-controls">
                        <button class="play-btn" id="p-play-btn">I&gt;</button>
                        <input type="range" class="volume-slider" id="p-volume" min="0" max="1" step="0.01" value="0.25">
                    </div>
                </div>
                <div class="progress-container" id="p-progress-container">
                    <div class="progress-bar" id="p-progress-bar"></div>
                </div>
                <audio id="p-audio" src="${escHtml(profile.musicUrl)}" loop crossorigin="anonymous"></audio>
            `;
            document.getElementById('p-tabs').before(audioBox);

            const audio = document.getElementById('p-audio');
            const playBtn = document.getElementById('p-play-btn');
            const volume = document.getElementById('p-volume');
            const progressBar = document.getElementById('p-progress-bar');
            const progressContainer = document.getElementById('p-progress-container');

            audio.volume = 0.25;
            playBtn.addEventListener('click', () => {
                if (audio.paused) { audio.play(); playBtn.textContent = '||'; }
                else { audio.pause(); playBtn.textContent = 'I>'; }
            });
            volume.addEventListener('input', e => { audio.volume = e.target.value; });
            audio.addEventListener('timeupdate', () => {
                progressBar.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
            });
            progressContainer.addEventListener('click', e => {
                audio.currentTime = (e.offsetX / progressContainer.clientWidth) * audio.duration;
            });
        }

        const tabsEl = document.getElementById('p-tabs');
        tabsEl.innerHTML = '';
        (profile.tabs || []).forEach(tab => {
            if (!tab.buttons?.length) return;
            const group = document.createElement('div');
            group.className = 'nav-group';
            group.innerHTML = `<span class="section-label">${escHtml(tab.label)}</span>`;
            tab.buttons.forEach(btn => {
                if (btn.type === 'copy') {
                    const b = document.createElement('button');
                    b.className = 'hub-btn';
                    b.textContent = btn.text;
                    b.addEventListener('click', () => copyToClipboard(btn.value));
                    group.appendChild(b);
                } else {
                    const a = document.createElement('a');
                    a.className = 'hub-btn';
                    a.href = btn.url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.textContent = btn.text;
                    group.appendChild(a);
                }
            });
            tabsEl.appendChild(group);
        });

        // Typewriter
        const phrases = (profile.bioStatements || []).filter(Boolean);
        if (phrases.length) {
            const target = document.getElementById('typewriter');
            let pIdx = 0, cIdx = 0, isDeleting = false;
            function type() {
                const current = phrases[pIdx];
                target.textContent = isDeleting ? current.substring(0, cIdx--) : current.substring(0, cIdx++);
                if (!isDeleting && cIdx > current.length) { isDeleting = true; setTimeout(type, 2000); }
                else if (isDeleting && cIdx < 0) { isDeleting = false; pIdx = (pIdx + 1) % phrases.length; cIdx = 0; setTimeout(type, 500); }
                else { setTimeout(type, isDeleting ? 40 : 80); }
            }
            setTimeout(type, 800);
        } else {
            document.getElementById('cursor').style.display = 'none';
        }

        // OG meta tags
        const setMeta = (sel, val) => { const el = document.querySelector(sel); if (el && val) el.setAttribute('content', val); };
        const ogTitle = profile.ogTitle || profile.displayName;
        const ogDesc  = profile.ogDescription || profile.bioStatements?.[0] || '';
        const ogImg   = profile.ogImage || profile.avatar || '';
        setMeta('meta[property="og:title"]', ogTitle);
        setMeta('meta[property="og:description"]', ogDesc);
        setMeta('meta[property="og:image"]', ogImg);
        setMeta('meta[property="og:url"]', window.location.href);
        setMeta('meta[name="twitter:title"]', ogTitle);
        setMeta('meta[name="twitter:description"]', ogDesc);
        setMeta('meta[name="twitter:image"]', ogImg);

        // Visitor counter
        const visitsEl = document.getElementById('p-visits');
        if (profile.visits) visitsEl.textContent = profile.visits.toLocaleString() + ' visits';
        fetch(`https://api.wrk.money/visit/${slug}`, { method: 'POST' }).catch(() => {});

        applyProfile(profile);

        // Background
        if (profile.bgUrl) loadCustomBg(profile.bgUrl, profile.bgType || 'image');
        else loadBackground(profile.background);
        syncBgToMusic(profile, document.getElementById('p-audio'));

        // Enter overlay
        const overlay = document.getElementById('enter-overlay');
        const content = document.getElementById('main-content');
        overlay.style.display = 'flex';
        document.getElementById('profile-wrap').classList.add('visible');

        overlay.addEventListener('click', () => {
            overlay.classList.add('hidden');
            content.classList.add('visible');
            if (profile.musicEnabled && profile.musicUrl) {
                const audio = document.getElementById('p-audio');
                const playBtn = document.getElementById('p-play-btn');
                if (audio) { audio.play().catch(() => {}); playBtn.textContent = '||'; }
            }
        });

    }

    function escHtml(str) {
        return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    const networkConfig = {
        particles: {
            number: { value: 80, density: { enable: true, area: 800 } },
            color: { value: "#ffffff" }, shape: { type: "circle" },
            opacity: { value: 0.3 }, size: { value: { min: 1, max: 3 } },
            links: { enable: true, distance: 150, color: "#ffffff", opacity: 0.2, width: 1 },
            move: { enable: true, speed: 1, direction: "none", outModes: { default: "out" } }
        },
        interactivity: {
            events: { onHover: { enable: true, mode: "grab" }, onClick: { enable: true, mode: "push" } },
            modes: { grab: { distance: 140, links: { opacity: 0.5 } }, push: { quantity: 4 } }
        },
        retina_detect: true
    };

    function loadCustomBg(url, type) {
        document.getElementById('tsparticles').style.display = 'none';
        const el = type === 'video' ? document.createElement('video') : document.createElement('img');
        el.id = 'bg-media'; el.src = url;
        if (type === 'video') { el.autoplay = true; el.muted = true; el.loop = true; el.playsInline = true; }
        document.body.insertBefore(el, document.body.firstChild);
    }

    function loadBackground(bg) {
        if (bg === 'matrix') { startMatrix(); return; }
        if (bg === 'visualizer') { startVisualizer(); return; }
        const cfg = { network: networkConfig, ...PARTICLE_LOOKS };
        tsParticles.load("tsparticles", cfg[bg] || networkConfig);
    }

    async function init() {
        if (!isProfileCandidate) {
            showNotFound();
            return;
        }

        try {
            const res = await fetch(`https://api.wrk.money/profile/${slug}`);
            if (!res.ok) throw new Error('not found');
            const profile = await res.json();
            renderProfile(profile);
        } catch {
            showNotFound();
        }
    }

    init();
</script>
<script src="/wrk_files/site.js?v=4" data-nav="mini"></script>
</body>
</html>
