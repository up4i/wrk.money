<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>directory | wrk.money</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#06070b">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/wrk_files/999circle.png" type="image/png">
    <link rel="stylesheet" href="/wrk_files/site.css?v=1">
    <style>
        .container { max-width: 860px; }
        input.search { width: min(100%, 280px); }
        .motd-card { border-color: var(--accent-line); background: var(--accent-soft); }
        .motd-label { color: var(--accent); font-size: 0.72rem; font-weight: 700; margin-bottom: 4px; }
        .motd-text { font-size: 0.88rem; }
        .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .user-card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 20px 12px 16px; background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); text-align: center; text-decoration: none; transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .user-card:hover { transform: translateY(-3px); background: var(--glass-hover); border-color: var(--accent-line); box-shadow: 0 12px 34px -14px rgba(0, 255, 136, 0.5); }
        .user-card-pfp { width: 64px; height: 64px; border-radius: 14px; border: 1px solid var(--border); object-fit: cover; margin-bottom: 4px; }
        .user-card-name { font-size: 0.92rem; font-weight: 700; text-transform: lowercase; word-break: break-word; }
        .user-card-uid { color: var(--faint); font-size: 0.72rem; }
        .user-card-badges { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; min-height: 16px; margin-top: 2px; }
        .badge-img { width: 16px; height: 16px; }
        .loading, .empty { grid-column: 1 / -1; color: var(--muted); font-size: 0.82rem; text-align: center; padding: 28px 0; }
        @media (max-width: 420px) { .user-grid { grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); } input.search { width: 100%; } }
    </style>
</head>
<body>
<script src="/wrk_files/site.js?v=2"></script>

<main class="container">
    <div class="page-head">
        <div>
            <h1>directory</h1>
            <p class="page-sub" id="member-count">every member on wrk.money.</p>
        </div>
        <input type="search" class="search" id="member-search" placeholder="search members" aria-label="search members">
    </div>

    <div id="motd-wrap" style="display:none" class="card motd-card">
        <div class="motd-label">motd</div>
        <div id="motd-text" class="motd-text"></div>
    </div>

    <div id="user-grid" class="user-grid">
        <div class="loading">loading...</div>
    </div>
</main>

<div class="console-footer">DIRECTORY // WRK_04</div>

<script src="/wrk_files/gift.js?v=5"></script>
<script>
    const token = localStorage.getItem('wrk_token');
    if (!token) goLogin();

    function authFetch(path, opts = {}) {
        return fetch(`https://api.wrk.money${path}`, {
            ...opts,
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) },
        });
    }

    function escHtml(str) {
        return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    const BADGE_DEFS = {
        admin:     { src: '/wrk_files/badge-admin.svg',     label: 'administrator' },
        early:     { src: '/wrk_files/badge-early.svg',     label: 'early starter' },
        tester:    { src: '/wrk_files/badge-tester.svg',    label: 'tester' },
        developer: { src: '/wrk_files/badge-developer.svg', label: 'developer' },
    };

    function renderUsers(users) {
        const grid = document.getElementById('user-grid');
        if (!users.length) { grid.innerHTML = '<div class="empty">no members yet</div>'; return; }
        document.getElementById('member-count').textContent = `${users.length} member${users.length === 1 ? '' : 's'} on wrk.money.`;
        grid.innerHTML = users.map(u => {
            const gift = parseGift(u.tgGiftUrl);
            const giftBadge = gift ? `<span class="gift-model badge-img" data-url="${escHtml(gift.url)}" title="${escHtml(gift.label)}"></span>` : '';
            return `
            <a href="/${escHtml(u.slug)}" class="user-card" data-search="${escHtml(`${u.displayName} ${u.slug}`.toLowerCase())}">
                <img src="${escHtml(u.avatar) || '/wrk_files/999circle.png'}" alt="" class="user-card-pfp">
                <div class="user-card-name">${escHtml(u.displayName)}</div>
                ${u.uid !== null && u.uid !== undefined ? `<div class="user-card-uid">UID #${u.uid}</div>` : ''}
                <div class="user-card-badges">
                    ${(u.badges || []).map(id => {
                        const b = BADGE_DEFS[id];
                        return b ? `<img src="${b.src}" alt="${b.label}" title="${b.label}" class="badge-img">` : '';
                    }).join('')}
                    ${giftBadge}
                </div>
            </a>`;
        }).join('');
        grid.querySelectorAll('.user-card-pfp').forEach(img => img.addEventListener('error', () => { img.src = '/wrk_files/999circle.png'; }, { once: true }));

        // Still frames here: a grid of looping animations would add up.
        grid.querySelectorAll('.gift-model').forEach(el => drawGiftModel(el, parseGift(el.dataset.url), false).catch(() => el.remove()));
    }

    document.getElementById('member-search').addEventListener('input', e => {
        const q = e.target.value.trim().toLowerCase();
        const grid = document.getElementById('user-grid');
        let shown = 0;
        grid.querySelectorAll('.user-card').forEach(card => {
            card.hidden = !card.dataset.search.includes(q);
            card.style.display = card.hidden ? 'none' : '';
            if (!card.hidden) shown++;
        });
        grid.querySelector('.empty')?.remove();
        if (!shown) grid.insertAdjacentHTML('beforeend', '<div class="empty">nobody matches that</div>');
    });

    async function init() {
        const [motdRes, usersRes] = await Promise.all([
            fetch('https://api.wrk.money/motd'),
            authFetch('/directory'),
        ]);

        if (motdRes.ok) {
            const { motd } = await motdRes.json();
            if (motd) {
                document.getElementById('motd-text').textContent = motd;
                document.getElementById('motd-wrap').style.display = 'block';
            }
        }

        if (usersRes.status === 401) return goLogin();
        if (usersRes.ok) renderUsers(await usersRes.json());
        else document.getElementById('user-grid').innerHTML = '<div class="empty">failed to load</div>';
    }

    init().catch(() => { document.getElementById('user-grid').innerHTML = '<div class="empty">failed to load, try refreshing</div>'; });
</script>
</body>
</html>
