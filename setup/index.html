<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>set your password | wrk.money</title>
    <meta name="theme-color" content="#06070b">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/wrk_files/site.css?v=3">
    <link rel="icon" href="/wrk_files/999circle.png" type="image/png">
    <style>
        .container { max-width: 420px; }
        h1 { margin-bottom: 6px; }
        .page-sub { margin: 0 0 22px; }
        form .btn { width: 100%; padding: 13px; margin-top: 4px; }
        .auth-links { color: var(--muted); font-size: 0.8rem; text-align: center; margin-top: 18px; }
        .auth-links a { color: var(--text); }
        .auth-links a:hover { color: var(--accent); }
    </style>
</head>
<body class="page-center">
<script src="/wrk_files/site.js?v=4"></script>
<main class="container">
    <h1>set your <span class="gradient-text">password</span></h1>
    <p class="page-sub">claim your account or reset a forgotten password with your one-time code.</p>
    <form class="card" id="setup-form">
        <div class="field">
            <label for="username">username</label>
            <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
            <label for="code">one-time code</label>
            <input type="text" id="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" required>
            <div class="hint">works once and expires after 1 hour</div>
        </div>
        <div class="field">
            <label for="password">new password</label>
            <input type="password" id="password" autocomplete="new-password" required>
            <div class="hint">minimum 8 characters</div>
        </div>
        <div class="field">
            <label for="confirm">confirm password</label>
            <input type="password" id="confirm" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary" id="submit" type="submit">set password</button>
        <div class="error" id="error" role="alert"></div>
    </form>
    <div class="auth-links">
        no code? <a href="https://t.me/ogkush" target="_blank" rel="noopener">dm me on telegram</a><br>
        already set up? <a href="/login">log in</a>
    </div>
</main>
<script>
    // pre-fill the username from the URL, e.g. /setup?username=john
    const params = new URLSearchParams(window.location.search);
    const userEl    = document.getElementById('username');
    userEl.value = params.get('username') || params.get('slug') || '';

    const codeEl    = document.getElementById('code');
    const passEl    = document.getElementById('password');
    const confEl    = document.getElementById('confirm');
    const submitBtn = document.getElementById('submit');
    const errorEl   = document.getElementById('error');

    function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.add('visible');
    }

    document.getElementById('setup-form').addEventListener('submit', async e => {
        e.preventDefault();
        const password = passEl.value;

        if (codeEl.value.replace(/[^a-z0-9]/gi, '').length < 10) return showError('a code has 10 characters, copy all of it');
        if (password !== confEl.value) return showError('passwords do not match');
        if (password.length < 8) return showError('password must be at least 8 characters');

        submitBtn.disabled = true;
        submitBtn.textContent = 'saving...';
        errorEl.classList.remove('visible');

        try {
            const res = await fetch('https://api.wrk.money/auth/setup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: userEl.value.trim(), code: codeEl.value, password }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'could not set your password');

            localStorage.setItem('wrk_token', data.token);
            localStorage.setItem('wrk_slug', data.slug);
            window.location.href = data.firstTime ? '/settings?welcome=1' : '/';
        } catch (e) {
            showError(e.message);
            submitBtn.disabled = false;
            submitBtn.textContent = 'set password';
        }
    });
</script>
</body>
</html>
