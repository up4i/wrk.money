<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>claim your profile | wrk.money</title>
    <meta name="theme-color" content="#06070b">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/wrk_files/site.css?v=1">
    <link rel="icon" href="/wrk_files/999circle.png" type="image/png">
    <style>
        .container { max-width: 420px; }
        h1 { margin-bottom: 6px; }
        .page-sub { margin: 0 0 22px; }
        .slug-row { display: flex; align-items: center; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: 8px; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
        .slug-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .slug-prefix { color: var(--muted); font-size: 0.85rem; padding-left: 14px; white-space: nowrap; }
        .slug-row input { flex: 1; min-width: 0; background: transparent; border: none; padding-left: 2px; }
        .slug-row input:focus { box-shadow: none; }
        form .btn { width: 100%; padding: 13px; margin-top: 4px; }
        .auth-links { color: var(--muted); font-size: 0.8rem; text-align: center; margin-top: 18px; }
        .auth-links a { color: var(--text); }
        .auth-links a:hover { color: var(--accent); }
    </style>
</head>
<body class="page-center">
<script src="/wrk_files/site.js?v=1"></script>
<main class="container">
    <h1>claim your <span class="gradient-text">profile</span></h1>
    <p class="page-sub">set a password for the account you were invited to.</p>
    <form class="card" id="setup-form">
        <div class="field">
            <label for="slug">your profile link</label>
            <div class="slug-row">
                <span class="slug-prefix">wrk.money/</span>
                <input type="text" id="slug" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </div>
        </div>
        <div class="field">
            <label for="password">new password</label>
            <input type="password" id="password" autocomplete="new-password" required>
            <div class="hint">minimum 8 characters</div>
        </div>
        <div class="field">
            <label for="confirm">confirm password</label>
            <input type="password" id="confirm" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary" id="submit" type="submit">claim profile</button>
        <div class="error" id="error" role="alert"></div>
    </form>
    <div class="auth-links">already set up? <a href="/login">log in</a></div>
</main>
<script>
    if (localStorage.getItem('wrk_token')) window.location.href = '/settings';

    // pre-fill slug from URL param e.g. /setup?slug=john
    const params = new URLSearchParams(window.location.search);
    if (params.get('slug')) document.getElementById('slug').value = params.get('slug');

    const slugEl    = document.getElementById('slug');
    const passEl    = document.getElementById('password');
    const confEl    = document.getElementById('confirm');
    const submitBtn = document.getElementById('submit');
    const errorEl   = document.getElementById('error');

    function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.add('visible');
    }

    document.getElementById('setup-form').addEventListener('submit', async e => {
        e.preventDefault();
        const slug     = slugEl.value.trim();
        const password = passEl.value;

        if (password !== confEl.value) return showError('passwords do not match');
        if (password.length < 8) return showError('password must be at least 8 characters');

        submitBtn.disabled = true;
        submitBtn.textContent = 'setting up...';
        errorEl.classList.remove('visible');

        try {
            const res = await fetch('https://api.wrk.money/auth/setup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ slug, password }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'setup failed');

            localStorage.setItem('wrk_token', data.token);
            localStorage.setItem('wrk_slug', data.slug);
            window.location.href = '/settings?welcome=1';
        } catch (e) {
            showError(e.message);
            submitBtn.disabled = false;
            submitBtn.textContent = 'claim profile';
        }
    });
</script>
</body>
</html>
