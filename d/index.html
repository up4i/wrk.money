<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>file | wrk.money</title>
    <meta name="theme-color" content="#06070b">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/wrk_files/999circle.png" type="image/png">
    <link rel="stylesheet" href="/wrk_files/site.css?v=1">
    <style>
        .container { position: relative; width: 100%; max-width: 480px; z-index: 1; text-align: center; }
        .file-card { background: var(--glass); border: 1px solid var(--border); border-radius: 8px; padding: 36px 28px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); margin-bottom: 16px; }
        .file-icon { font-size: 2rem; margin-bottom: 20px; color: var(--muted); }
        .file-name-display { font-size: 0.9rem; opacity: 0.85; margin-bottom: 8px; word-break: break-all; }
        .file-meta { font-size: 0.72rem; letter-spacing: 0.5px; margin-bottom: 28px; color: var(--muted); }
        .download-btn { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; letter-spacing: 0.5px; text-transform: lowercase; padding: 12px 32px; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-decoration: none; background: var(--accent); border: 1px solid var(--accent); color: var(--on-accent); font-weight: 700; }
        .download-btn:hover { filter: brightness(1.1); box-shadow: 0 8px 26px -8px rgba(0, 255, 136, 0.7); }
        .expires-label { font-size: 0.72rem; letter-spacing: 1px; margin-top: 14px; color: var(--muted); }
        .loading { font-size: 0.75rem; letter-spacing: 0.5px; padding: 60px 0; color: var(--muted); }
        .error-state { display: none; }
        .error-state.visible { display: block; }
        .error-state h2 { font-size: 1rem; letter-spacing: 0.5px; font-weight: 400; margin-bottom: 20px; color: var(--muted); }
        .new-btn { display: inline-block; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; font-size: 0.72rem; letter-spacing: 0.5px; padding: 8px 20px; border-radius: 8px; text-decoration: none; transition: all 0.2s; }
        .new-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.4); }
        .preview-image { max-width: 100%; max-height: 400px; border-radius: 8px; margin-bottom: 16px; display: block; margin-left: auto; margin-right: auto; }
        .preview-audio { width: 100%; margin-bottom: 20px; accent-color: rgba(255,255,255,0.6); }
    </style>
</head>
<body>
<script src="/wrk_files/site.js?v=2"></script>

<div class="container">
    <a href="/tools/fileshare" class="back-link">← file share</a>

    <div id="loading" class="loading">loading...</div>

    <div id="error-state" class="error-state">
        <h2>file not found or expired</h2>
        <a href="/tools/fileshare" class="new-btn">upload a file</a>
    </div>

    <div id="file-view" style="display:none">
        <img id="preview-image" class="preview-image" style="display:none" alt="">
        <div class="file-card">
            <div id="preview-audio-wrap" style="display:none">
                <audio id="preview-audio" class="preview-audio" controls></audio>
            </div>
            <div class="file-icon">↓</div>
            <div class="file-name-display" id="file-name"></div>
            <div class="file-meta" id="file-meta"></div>
            <a class="download-btn" id="download-btn" href="#">download</a>
        </div>
        <div class="expires-label" id="expires-label"></div>
    </div>
</div>

<div class="console-footer">FILE.VIEW // WRK_03</div>

<script>

    function formatBytes(bytes) {
        if (bytes < 1024) return `${bytes} b`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} kb`;
        return `${(bytes / 1024 / 1024).toFixed(1)} mb`;
    }

    const id = new URLSearchParams(window.location.search).get('id');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error-state');
    const fileView = document.getElementById('file-view');

    async function loadFile() {
        if (!id) {
            loadingEl.style.display = 'none';
            errorEl.classList.add('visible');
            return;
        }

        try {
            const res = await fetch(`https://api.wrk.money/d/${id}/meta`);
            if (!res.ok) throw new Error();
            const meta = await res.json();

            const rawUrl = `https://api.wrk.money/d/${id}`;
            document.getElementById('file-name').textContent = meta.name;
            document.getElementById('file-meta').textContent = `${formatBytes(meta.size)} · ${meta.type}`;
            document.getElementById('download-btn').href = rawUrl;
            document.title = `${meta.name} | wrk.money`;

            if (meta.type.startsWith('image/')) {
                const img = document.getElementById('preview-image');
                img.src = rawUrl;
                img.alt = meta.name;
                img.style.display = 'block';
            } else if (meta.type.startsWith('audio/')) {
                const wrap = document.getElementById('preview-audio-wrap');
                document.getElementById('preview-audio').src = rawUrl;
                wrap.style.display = 'block';
            }

            if (meta.expiresAt) {
                const exp = new Date(meta.expiresAt);
                document.getElementById('expires-label').textContent =
                    `expires ${exp.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
            }

            loadingEl.style.display = 'none';
            fileView.style.display = 'block';
        } catch {
            loadingEl.style.display = 'none';
            errorEl.classList.add('visible');
        }
    }

    loadFile();
</script>
</body>
</html>
