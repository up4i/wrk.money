<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>log in | wrk.money</title>
    <meta name="theme-color" content="#06070b">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/wrk_files/site.css?v=3">
    <link rel="icon" href="/wrk_files/999circle.png" type="image/png">
    <style>
        .container { max-width: 400px; }
        h1 { margin-bottom: 22px; }
        form .btn { width: 100%; padding: 13px; margin-top: 4px; }
        .auth-links { color: var(--muted); font-size: 0.8rem; text-align: center; line-height: 1.9; margin-top: 18px; }
        .auth-links a { color: var(--text); }
        .auth-links a:hover { color: var(--accent); }
    </style>
</head>
<body class="page-center">
<script src="/wrk_files/site.js?v=4"></script>
<main class="container">
    <h1>welcome <span class="gradient-text">back</span></h1>
    <div class="notice" id="from-notice" hidden></div>
    <form class="card" id="login-form">
        <div class="field">
            <label for="username">username</label>
            <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
            <label for="password">password</label>
            <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary" id="submit" type="submit">log in</button>
        <div class="error" id="error" role="alert"></div>
    </form>
    <div class="auth-links">
        have a one-time code? <a href="/setup">set your password</a><br>
        no account or code? <a href="https://t.me/ogkush" target="_blank" rel="noopener">dm me on telegram</a>
    </div>
</main>
<script>
    // Only same-site paths: this value is navigated to, and a javascript: link would run on this origin.
    const _from = new URLSearchParams(location.search).get('from') || '';
    const _redirectTo = /^\/(?![/\\])/.test(_from) ? _from : '/';
    if (localStorage.getItem('wrk_token')) window.location.href = _redirectTo;

    if (_redirectTo !== '/') {
        const notice = document.getElementById('from-notice');
        notice.textContent = `log in to continue to ${_redirectTo.replace(/^\/|\/$/g, '').split('/').pop()}.`;
        notice.hidden = false;
    }

    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const submitBtn  = document.getElementById('submit');
    const errorEl    = document.getElementById('error');

    document.getElementById('login-form').addEventListener('submit', async e => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'logging in...';
        errorEl.classList.remove('visible');

        try {
            const res = await fetch('https://api.wrk.money/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameEl.value.trim(), password: passwordEl.value }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'login failed');
            localStorage.setItem('wrk_token', data.token);
            localStorage.setItem('wrk_slug', data.slug);
            localStorage.setItem('wrk_prefs', JSON.stringify(data.prefs || {}));
            const landing = { directory: '/directory', tools: '/tools', startpage: '/startpage', profile: `/${data.slug}` }[data.prefs?.landing];
            window.location.href = _redirectTo === '/' ? landing || '/' : _redirectTo;
        } catch (e) {
            errorEl.textContent = e.message;
            errorEl.classList.add('visible');
            submitBtn.disabled = false;
            submitBtn.textContent = 'log in';
        }
    });
</script>
</body>
</html>
