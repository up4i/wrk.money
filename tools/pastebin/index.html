<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pastebin | wrk.money</title>
    <meta name="description" content="paste text. get a link.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wrk.money/tools/pastebin">
    <meta property="og:title" content="pastebin | wrk.money">
    <meta property="og:description" content="paste text. get a link.">
    <meta name="theme-color" content="#06070b">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/wrk_files/999circle.png" type="image/png">
    <link rel="stylesheet" href="/wrk_files/site.css?v=4">
    <style>
        .container { position: relative; width: 100%; max-width: 720px; z-index: 1; }
        h1 { font-size: 2rem; font-weight: 700; letter-spacing: 0.5px; text-transform: lowercase; opacity: 0.9; margin-bottom: 2rem; }
        .controls { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .controls select { width: auto; flex: 1; min-width: 150px; cursor: pointer; }
        textarea { min-height: 360px; line-height: 1.6; padding: 16px; resize: vertical; }
        .bottom-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; flex-wrap: wrap; gap: 10px; }
        .char-count { font-size: 0.72rem; letter-spacing: 1px; color: var(--muted); }
        button { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; letter-spacing: 0.5px; text-transform: lowercase; padding: 10px 22px; border-radius: 8px; cursor: pointer; transition: all 0.2s; background: var(--accent); border: 1px solid var(--accent); color: var(--on-accent); font-weight: 700; }
        button:hover:not(:disabled) { filter: brightness(1.1); box-shadow: 0 8px 26px -8px rgba(var(--accent-rgb), 0.7); }
        .result-card { display: none; background: var(--glass); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 20px 24px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .result-card.visible { display: block; }
        .result-label { font-size: 0.72rem; letter-spacing: 0.5px; margin-bottom: 10px; color: var(--muted); }
        .result-url-row { display: flex; gap: 10px; align-items: center; }
        .result-url { flex: 1; font-size: 0.8rem; color: #fff; text-decoration: none; opacity: 0.85; word-break: break-all; transition: opacity 0.2s; }
        .result-url:hover { opacity: 1; }
        .copy-btn { flex-shrink: 0; padding: 8px 16px; font-size: 0.72rem; }
        .error-msg { display: none; font-size: 0.72rem; color: #ff6b6b; opacity: 0.8; margin-top: 12px; letter-spacing: 1px; }
        .error-msg.visible { display: block; }
    </style>
    <script>if (!localStorage.getItem('wrk_token')) location.replace('/login?from=/tools/pastebin');</script>
</head>
<body>
<script src="/wrk_files/site.js?v=5"></script>

<div class="container">
    <a href="/tools" class="back-link">← tools</a>
    <h1>pastebin</h1>

    <div class="card">
        <div class="controls">
            <select id="lang">
                <option value="plaintext">plaintext</option>
                <option value="python">python</option>
                <option value="javascript">javascript</option>
                <option value="typescript">typescript</option>
                <option value="html">html</option>
                <option value="css">css</option>
                <option value="bash">bash</option>
                <option value="json">json</option>
                <option value="sql">sql</option>
                <option value="markdown">markdown</option>
                <option value="yaml">yaml</option>
                <option value="go">go</option>
                <option value="rust">rust</option>
                <option value="c">c</option>
                <option value="cpp">c++</option>
            </select>
            <select id="ttl">
                <option value="3600">1 hour</option>
                <option value="86400">1 day</option>
                <option value="604800" selected>7 days</option>
                <option value="2592000">30 days</option>
            </select>
        </div>

        <textarea id="content" placeholder="paste your text here..."></textarea>

        <div class="bottom-row">
            <span class="char-count" id="char-count">0 / 500,000</span>
            <button id="submit-btn">create paste</button>
        </div>

        <div class="error-msg" id="error-msg"></div>
    </div>

    <div class="result-card" id="result-card">
        <div class="result-label">PASTE CREATED</div>
        <div class="result-url-row">
            <a class="result-url" id="result-url" href="#" target="_blank"></a>
            <button class="copy-btn" id="copy-btn">copy</button>
        </div>
    </div>
</div>

<div class="console-footer">PASTE.READY // WRK_02</div>

<script>

    const contentEl = document.getElementById('content');
    const charCount = document.getElementById('char-count');
    const submitBtn = document.getElementById('submit-btn');
    const resultCard = document.getElementById('result-card');
    const resultUrl = document.getElementById('result-url');
    const copyBtn = document.getElementById('copy-btn');
    const errorMsg = document.getElementById('error-msg');

    contentEl.addEventListener('input', () => {
        const len = contentEl.value.length;
        charCount.textContent = `${len.toLocaleString()} / 500,000`;
        charCount.style.opacity = len > 480000 ? '0.7' : '0.25';
    });

    submitBtn.addEventListener('click', async () => {
        const content = contentEl.value.trim();
        if (!content) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'creating...';
        errorMsg.classList.remove('visible');
        resultCard.classList.remove('visible');

        try {
            const res = await fetch('https://api.wrk.money/p', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content,
                    lang: document.getElementById('lang').value,
                    ttl: parseInt(document.getElementById('ttl').value),
                }),
            });

            const data = await res.json();

            if (!res.ok) throw new Error(data.error || 'something went wrong');

            resultUrl.href = data.url;
            resultUrl.textContent = data.url;
            resultCard.classList.add('visible');
        } catch (e) {
            errorMsg.textContent = e.message;
            errorMsg.classList.add('visible');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'create paste';
        }
    });

    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(resultUrl.href).then(() => {
            copyBtn.textContent = 'copied!';
            setTimeout(() => copyBtn.textContent = 'copy', 2000);
        });
    });
</script>
</body>
</html>
