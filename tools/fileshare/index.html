<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>file share | wrk.money</title>
    <meta name="description" content="upload a file. get a link.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wrk.money/tools/fileshare">
    <meta property="og:title" content="file share | wrk.money">
    <meta property="og:description" content="upload a file. get a link.">
    <meta name="theme-color" content="#06070b">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/wrk_files/999circle.png" type="image/png">
    <link rel="stylesheet" href="/wrk_files/site.css?v=3">
    <style>
        .container { position: relative; width: 100%; max-width: 520px; z-index: 1; }
        h1 { font-size: 2rem; font-weight: 700; letter-spacing: 0.5px; text-transform: lowercase; opacity: 0.9; margin-bottom: 2rem; }
        .drop-zone { border: 1px dashed rgba(255,255,255,0.2); border-radius: 8px; padding: 48px 24px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); margin-bottom: 16px; position: relative; }
        .drop-zone:hover, .drop-zone.drag-over { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.05); }
        .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
        .drop-icon { font-size: 1.8rem; margin-bottom: 12px; color: var(--muted); }
        .drop-label { font-size: 0.75rem; letter-spacing: 0.5px; margin-bottom: 6px; color: var(--muted); }
        .drop-sublabel { font-size: 0.72rem; letter-spacing: 1px; color: var(--muted); }
        .file-selected { display: none; background: var(--glass); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .file-selected.visible { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .file-info { flex: 1; min-width: 0; }
        .file-name { font-size: 0.75rem; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .file-size { font-size: 0.72rem; letter-spacing: 1px; color: var(--muted); }
        .clear-file { font-size: 0.72rem; cursor: pointer; padding: 4px 8px; transition: opacity 0.2s; background: none; border: none; color: #fff; letter-spacing: 0; }
        .clear-file:hover { opacity: 0.7; }
        .controls-row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .controls-row select { width: auto; flex: 1; min-width: 150px; cursor: pointer; }
        .controls-label { font-size: 0.72rem; letter-spacing: 0.5px; color: var(--muted); }
        button.upload-btn { width: 100%; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; letter-spacing: 0.5px; text-transform: lowercase; padding: 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s; background: var(--accent); border: 1px solid var(--accent); color: var(--on-accent); font-weight: 700; }
        button.upload-btn:hover:not(:disabled) { filter: brightness(1.1); box-shadow: 0 8px 26px -8px rgba(var(--accent-rgb), 0.7); }
        button.upload-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .progress-wrap { display: none; margin-top: 12px; }
        .progress-wrap.visible { display: block; }
        .progress-bar-bg { width: 100%; height: 2px; background: rgba(255,255,255,0.08); border-radius: 8px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: rgba(255,255,255,0.5); border-radius: 8px; width: 0%; transition: width 0.2s; }
        .progress-label { font-size: 0.72rem; letter-spacing: 1px; margin-top: 6px; text-align: center; color: var(--muted); }
        .result-card { display: none; background: var(--glass); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 20px 24px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); margin-top: 16px; }
        .result-card.visible { display: block; }
        .result-label { font-size: 0.72rem; letter-spacing: 0.5px; margin-bottom: 10px; color: var(--muted); }
        .result-url-row { display: flex; gap: 10px; align-items: center; }
        .result-url { flex: 1; font-size: 0.8rem; color: #fff; text-decoration: none; opacity: 0.85; word-break: break-all; transition: opacity 0.2s; }
        .result-url:hover { opacity: 1; }
        .copy-btn { flex-shrink: 0; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; letter-spacing: 0.5px; padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .copy-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.4); }
        .error-msg { display: none; font-size: 0.72rem; color: #ff6b6b; opacity: 0.8; margin-top: 12px; letter-spacing: 1px; }
        .error-msg.visible { display: block; }
    </style>
    <script>if (!localStorage.getItem('wrk_token')) location.replace('/login?from=/tools/fileshare');</script>
    <script>
    (async () => {
        const token = localStorage.getItem('wrk_token');
        const res = await fetch('https://api.wrk.money/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) { localStorage.removeItem('wrk_token'); location.replace('/login?from=/tools/fileshare'); return; }
        const { profile } = await res.json();
        const isAdmin = (profile?.badges || []).includes('admin');
        if (!isAdmin) document.getElementById('ttl').querySelector('option[value="never"]').remove();
    })();
    </script>
</head>
<body>
<script src="/wrk_files/site.js?v=4"></script>

<div class="container">
    <a href="/tools" class="back-link">← tools</a>
    <h1>file share</h1>

    <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input">
        <div class="drop-icon">↑</div>
        <div class="drop-label">drop file or click to browse</div>
        <div class="drop-sublabel">max 100mb</div>
    </div>

    <div class="file-selected" id="file-selected">
        <div class="file-info">
            <div class="file-name" id="file-name"></div>
            <div class="file-size" id="file-size"></div>
        </div>
        <button class="clear-file" id="clear-file">✕</button>
    </div>

    <div class="controls-row">
        <span class="controls-label">expires</span>
        <select id="ttl">
            <option value="1d">1 day</option>
            <option value="7d" selected>7 days</option>
            <option value="30d">30 days</option>
            <option value="never">never</option>
        </select>
    </div>

    <button class="upload-btn" id="upload-btn" disabled>upload</button>

    <div class="progress-wrap" id="progress-wrap">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div class="progress-label" id="progress-label">uploading...</div>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <div class="result-card" id="result-card">
        <div class="result-label">FILE UPLOADED</div>
        <div class="result-url-row">
            <a class="result-url" id="result-url" href="#" target="_blank"></a>
            <button class="copy-btn" id="copy-btn">copy</button>
        </div>
    </div>
</div>

<div class="console-footer">FILE.READY // WRK_03</div>

<script>

    let selectedFile = null;

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileSelected = document.getElementById('file-selected');
    const fileName = document.getElementById('file-name');
    const fileSize = document.getElementById('file-size');
    const clearFile = document.getElementById('clear-file');
    const uploadBtn = document.getElementById('upload-btn');
    const progressWrap = document.getElementById('progress-wrap');
    const progressFill = document.getElementById('progress-fill');
    const progressLabel = document.getElementById('progress-label');
    const resultCard = document.getElementById('result-card');
    const resultUrl = document.getElementById('result-url');
    const copyBtn = document.getElementById('copy-btn');
    const errorMsg = document.getElementById('error-msg');

    function formatBytes(bytes) {
        if (bytes < 1024) return `${bytes} b`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} kb`;
        return `${(bytes / 1024 / 1024).toFixed(1)} mb`;
    }

    function setFile(file) {
        selectedFile = file;
        fileName.textContent = file.name;
        fileSize.textContent = formatBytes(file.size);
        fileSelected.classList.add('visible');
        uploadBtn.disabled = false;
        resultCard.classList.remove('visible');
        errorMsg.classList.remove('visible');
    }

    function clearSelection() {
        selectedFile = null;
        fileInput.value = '';
        fileSelected.classList.remove('visible');
        uploadBtn.disabled = true;
    }

    fileInput.addEventListener('change', () => {
        if (fileInput.files[0]) setFile(fileInput.files[0]);
    });

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
    });

    clearFile.addEventListener('click', clearSelection);

    uploadBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        uploadBtn.disabled = true;
        errorMsg.classList.remove('visible');
        resultCard.classList.remove('visible');
        progressWrap.classList.add('visible');
        progressFill.style.width = '0%';
        progressLabel.textContent = 'uploading...';

        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('ttl', document.getElementById('ttl').value);

        try {
            // Use XMLHttpRequest for progress tracking
            const url = await new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', 'https://api.wrk.money/d');
                xhr.setRequestHeader('Authorization', `Bearer ${localStorage.getItem('wrk_token')}`);

                xhr.upload.addEventListener('progress', e => {
                    if (e.lengthComputable) {
                        const pct = Math.round((e.loaded / e.total) * 100);
                        progressFill.style.width = `${pct}%`;
                        progressLabel.textContent = `${pct}% — ${formatBytes(e.loaded)} / ${formatBytes(e.total)}`;
                    }
                });

                xhr.addEventListener('load', () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const data = JSON.parse(xhr.responseText);
                        resolve(data.url);
                    } else {
                        const data = JSON.parse(xhr.responseText);
                        reject(new Error(data.error || 'upload failed'));
                    }
                });

                xhr.addEventListener('error', () => reject(new Error('network error')));
                xhr.send(formData);
            });

            progressFill.style.width = '100%';
            progressLabel.textContent = 'done';

            resultUrl.href = url;
            resultUrl.textContent = url;
            resultCard.classList.add('visible');
        } catch (e) {
            errorMsg.textContent = e.message;
            errorMsg.classList.add('visible');
            progressWrap.classList.remove('visible');
        } finally {
            uploadBtn.disabled = false;
        }
    });

    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(resultUrl.href).then(() => {
            copyBtn.textContent = 'copied!';
            setTimeout(() => copyBtn.textContent = 'copy', 2000);
        });
    });
</script>
</body>
</html>
